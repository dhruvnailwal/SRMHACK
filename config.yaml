# ============================================================
# Unseen-Customer Fraud Detection - pipeline configuration
# All values here are defaults; src/config.py turns them into a
# lightweight Settings object. Paths are relative to the project
# root (the folder that contains this file).
# ============================================================

project:
  name: "Unseen-Customer Fraud Detection Using Fraud Probability and Behavioral Novelty"
  seed: 42

data:
  raw_file: "data/raw/synthetic_fraud_transactions.csv"
  processed_dir: "data/processed"
  database_note: >
    DataLoader tolerates slight structural differences: it maps common aliases
    (timestamp/event_time/time, customer_id/customer_key, ...) to the canonical
    names below instead of failing.

columns:
  id: transaction_id
  time: timestamp
  customer: customer_id
  merchant: merchant_id
  device: device_id
  amount: amount
  hour: transaction_hour
  night: is_night
  new_customer: new_customer
  new_merchant: new_merchant
  new_device: new_device
  velocity_8min: velocity_8min
  amount_spike: amount_spike
  cust_hist_count: customer_history_count
  merch_hist_count: merchant_history_count
  device_hist_count: device_history_count
  label: is_fraud

splits:
  train_frac: 0.60
  val_frac: 0.20
  test_frac: 0.20
  # Ensemble split (unseen-customer) selects a disjoint set of customers
  # after the chronological split has been made.
  unseen_customer_frac: 0.20
  # History strata for cold-start/cold-cohort reporting.
  cold_max_prior: 0
  warm_min_prior: 1
  warm_max_prior: 4
  established_min_prior: 5

features:
  # Tolerance window used for provided-column parity checks (minutes).
  parity_velocity_window_min: 8
  # Cold-start shrinkage strength (pseudo-observations).
  cold_kappa: 5.0
  # Minimum number of customer transactions to use the customer's own
  # amount baseline instead of the segment prior.
  customer_baseline_min_n: 3
  novelty_model: "isolation_forest"   # isolation_forest | lof | one_class_svm | autoencoder
  novelty_noise: 0.4
  novelty_normalize_on: "calibration" # legitimate rows used to fit the ECDF

models:
  compare: ["logistic_regression", "random_forest", "lightgbm"]
  primary: "lightgbm"
  lightgbm:
    scale_pos_weight: "auto"          # auto = sqrt(neg/pos); set a float to override
    num_leaves: 63
    min_child_samples: 80
    learning_rate: 0.08
    n_estimators: 600
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 5.0
    verbosity: -1
  random_forest:
    n_estimators: 300
    max_depth: 18
    min_samples_leaf: 30
    n_jobs: -1
  logistic_regression:
    C: 0.5
    max_iter: 2000

calibration:
  method: "isotonic"    # platt | isotonic | auto (choose by Brier on validation)
  bins: 10

risk:
  # Decision matrix thresholds (selected on VALIDATION data - see scripts/06_*):
  p_review: 0.15        # fraud_probability at/above which -> review (alone)
  p_high: 0.45          # fraud_probability at/above which -> high-risk (alone)
  novelty_high: 0.90    # novelty at/above which -> monitor (alone)
  novelty_very_high: 0.97
  p_floor_for_novelty: 0.02   # min probability for the novelty->review channel
  # Bands are: normal < monitor < review < high-risk
  #           p low + novelty low  -> normal
  #           p low + novelty high -> monitor
  #           p high + novelty low -> review
  #           p high + novelty high-> high-risk
  alert_budget_pct: 2.0        # % of transactions that may be escalated
  high_risk_share_cap_pct: 0.7 # cap on high-risk alerts as % of txns
  max_alerts_per_hour: 250
  max_alerts_per_day: 3000

evaluation:
  alert_budget_pct_grid: [0.5, 1.0, 2.0, 3.0, 5.0]
  shap_sample_size: 2000
  explanation_reason_groups: true

dashboard:
  host: "localhost"
  port: 8501

api:
  host: "0.0.0.0"
  port: 8000